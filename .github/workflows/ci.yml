name : ci

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop
  
  jobs:
    test:
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: app

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4

        - name: Setup Node.js
          uses: action/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: app/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Run test
          run: npm testt

        - name: Build Docker Image
          run: |
            docker build\
              -t devops-deployment-lab:${{ github.sha }} \
